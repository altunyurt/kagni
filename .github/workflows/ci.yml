name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv and dependencies
        run: |
          python -m pip install --quiet uv
          uv sync --frozen
      - name: Run the test suite (units, sequence battery, parser fuzz)
        run: uv run pytest -q

  differential:
    name: differential vs real redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv and dependencies
        run: |
          python -m pip install --quiet uv
          uv sync --frozen
      - name: Run the suite plus the byte-parity battery against redis 7.4
        env:
          KAGNI_DIFF_REDIS: 127.0.0.1:6379
        run: |
          uv run pytest -q
          uv run python tests/differential.py
