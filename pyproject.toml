[project]
name = "kagni"
version = "0.8.0"
description = "Python-native, Redis-protocol data store daemon with sqlite snapshots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Özgür Altunyurt", email = "altunyurt@gmail.com" }
]
keywords = ["redis", "resp", "server", "database", "sqlite", "asyncio", "trio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
]
requires-python = ">=3.11"
dependencies = [
    "apsw>=3.53.4.0",
    "hiredis>=3.0.0",
    "pyroaring>=1.1.0",
    "trio>=0.34.0",
    "uvloop>=0.22.1",
]

[project.urls]
Homepage = "https://github.com/altunyurt/kagni"
Repository = "https://github.com/altunyurt/kagni"
Issues = "https://github.com/altunyurt/kagni/issues"

[project.scripts]
kagni = "kagni.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
